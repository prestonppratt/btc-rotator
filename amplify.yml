version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18
        - nvm use 18
        - npm ci
    build:
      commands:
        - npm run build
        - '# Copy amplify_outputs.json from public to dist for runtime access'
        - cp public/amplify_outputs.json dist/amplify_outputs.json || echo "amplify_outputs.json not found - backend may need to deploy first"
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
backend:
  phases:
    preBuild:
      commands:
        - nvm install 18
        - nvm use 18
        - npm ci
    build:
      commands:
        - '# Deploy backend with Amplify Gen 2'
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir public || true
        - '# amplify_outputs.json should now be in public/ directory'
