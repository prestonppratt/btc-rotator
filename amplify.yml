version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
backend:
  phases:
    build:
      commands:
        - '# Install Python 3.12'
        - pyenv install -s 3.12.0 || true
        - pyenv global 3.12.0 || true
        - python3.12 --version || python3 --version
        - '# Install Amplify CLI'
        - npm install -g @aws-amplify/cli
        - '# Deploy backend'
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

