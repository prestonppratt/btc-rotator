version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18
        - nvm use 18
        - node --version
        - npm --version
        - npm ci
    build:
      commands:
        - npm run build
        - ls -la dist/
        - test -f dist/index.html || (echo "ERROR: index.html not found in dist/" && exit 1)
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
