version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18
        - nvm use 18
        - npm ci
        - '# Copy amplify_outputs.json to public directory for frontend access'
        - cp amplify_outputs.json public/amplify_outputs.json || echo "amplify_outputs.json not found, backend may not be deployed yet"
    build:
      commands:
        - npm run build
        - '# Copy amplify_outputs.json to dist directory'
        - cp public/amplify_outputs.json dist/amplify_outputs.json || echo "amplify_outputs.json not found"
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
backend:
  phases:
    preBuild:
      commands:
        - nvm install 18
        - nvm use 18
        - npm ci
    build:
      commands:
        - '# Deploy backend with Amplify Gen 2'
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
        - '# amplify_outputs.json should be generated in the current directory'
