type Ticker @model @auth(rules: [{allow: public, operations: [read]}, {allow: private, operations: [create, update, delete]}]) {
  id: ID!
  symbol: String!
  name: String!
  price: Float
  change24h: Float
  changePercent24h: Float
  volume: Float
  marketCap: Float
  lastUpdated: AWSTimestamp
}

type UserRotation @model @auth(rules: [{allow: owner}, {allow: public, operations: [read]}]) {
  id: ID!
  userId: String!
  tickerSymbol: String!
  rotationOrder: Int!
  createdAt: AWSTimestamp
  updatedAt: AWSTimestamp
}

type RotationHistory @model @auth(rules: [{allow: owner}, {allow: public, operations: [read]}]) {
  id: ID!
  userId: String!
  fromTicker: String!
  toTicker: String!
  timestamp: AWSTimestamp!
  reason: String
}

type User @model @auth(rules: [{allow: owner}]) {
  id: ID!
  email: String!
  phone: String
  isPaid: Boolean! @default(value: "false")
  signupDate: AWSDateTime!
  notificationFreq: String! # "daily" | "weekly" | "biweekly" | "monthly" | "off"
  portfolio: [Holding]
  tradeHistory: [Trade]
}

type Holding {
  ticker: String!
  shares: Float!
}

type Trade {
  date: AWSDateTime!
  sellTicker: String!
  buyTicker: String!
  reason: String!
}

